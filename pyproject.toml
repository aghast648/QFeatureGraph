[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qfeaturegraph"
version = "0.0.0"
description = "Graph-based structured CNN channel pruning with exact QUBO optimization and ideal QAOA comparison"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Alireza Ghazanfary" },
]
keywords = [
  "channel-pruning",
  "feature-graph",
  "qubo",
  "qaoa",
  "pytorch",
  "qiskit",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.9",
  "networkx>=3.3",
  "numpy>=2.0",
  "packaging>=24.1",
  "pandas>=2.2",
  "PyYAML>=6.0.1",
  "scipy>=1.13",
  "torch>=2.3",
  "torchvision>=0.18",
]

[project.optional-dependencies]
quantum = ["qiskit>=1.2"]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0.12.20240808",
]

[project.urls]
Homepage = "https://github.com/aghast648/QFeatureGraph"
Repository = "https://github.com/aghast648/QFeatureGraph"
Issues = "https://github.com/aghast648/QFeatureGraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qfeaturegraph"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
